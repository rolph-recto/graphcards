# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        # Install a specific version of uv.
        version: "0.11.32"
    - name: Sync dependencies
      run: |
        uv sync
    - name: Test with pytest
      run: |
        uv run pytest -W error \
          --ignore=tests/test_property_config.py \
          --ignore=tests/test_property_decks.py \
          --ignore=tests/test_property_models.py \
          --ignore=tests/test_property_storage.py \
          --ignore=tests/web/test_property_web.py
    - name: Test Hypothesis properties
      timeout-minutes: 5
      run: |
        uv run pytest -W error \
          tests/test_property_models.py \
          tests/test_property_config.py \
          tests/test_property_decks.py \
          tests/test_property_storage.py \
          tests/web/test_property_web.py
