[project]
name = "rdfcards"
version = "0.1.0"
description = "Learn RDF triples and entities with SPARQL-driven cards and FSRS scheduling"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fsrs>=6.3,<7",
    "pydantic>=2.12,<3",
    "rdflib>=7.6,<8",
]

[project.scripts]
rdfcards = "rdfcards.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdfcards"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
