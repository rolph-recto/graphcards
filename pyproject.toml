[project]
name = "graphcards"
version = "0.1.0"
description = "Learn entity-backed exercises with FSRS scheduling"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rolph Recto", email = "rolph.recto@gmail.com" }]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "flask>=3.1,<4",
    "fsrs>=6.3,<7",
    "jinja2>=3.1,<4",
    "pydantic>=2.12,<3",
    "pyparsing>=3.2,<4",
    "tomlkit>=0.13,<1",
    "pyyaml>=6.0,<7",
]

[project.scripts]
graphcards = "graphcards.cli:main"

[project.urls]
Homepage = "https://github.com/rolph-recto/graphcards"
Repository = "https://github.com/rolph-recto/graphcards"
Issues = "https://github.com/rolph-recto/graphcards/issues"
Documentation = "https://github.com/rolph-recto/graphcards/tree/main/docs"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytailwindcss>=0.3.1",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphcards"]

[tool.hatch.build.targets.wheel.force-include]
templates = "graphcards/templates"

[tool.hatch.build.targets.sdist]
include = [
    "/.python-version",
    "/AGENTS.md",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/templates",
    "/tests",
    "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
