[project]
name = "graphcards"
version = "0.1.0"
description = "Learn entity-backed exercises with FSRS scheduling"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1,<4",
    "fsrs>=6.3,<7",
    "jinja2>=3.1,<4",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
graphcards = "graphcards.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytailwindcss>=0.3.1",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphcards"]

[tool.hatch.build.targets.sdist]
include = [
    "/.python-version",
    "/AGENTS.md",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
