<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · GraphCards</title>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% set width = main_width | default('max-w-4xl') %}
  <main class="mx-auto w-full {{ width }} px-4 py-8 md:py-16">
    <div{% if wrapper_class %} class="{{ wrapper_class }}"{% endif %}>
      <header class="mb-8 flex items-center justify-between gap-4 border-b border-neutral-200 pb-3.5">
        <a class="text-xs font-bold tracking-widest text-neutral-900 no-underline" href="{{ url_for('index') }}">GRAPHCARDS</a>
        {% block masthead %}{% endblock %}
      </header>
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
